name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore
        run: dotnet restore BookShelf.sln
      - name: Build
        run: dotnet build BookShelf.sln --configuration Release --no-restore --warnaserror
      - name: Test
        run: dotnet test BookShelf.sln --configuration Release --no-build --logger "console;verbosity=normal"
